name: 3dgs
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip>=23.0
  - pytorch>=2.0
  - torchvision
  - pytorch-cuda=11.8     # change to 12.1 if your driver requires it
  - plyfile
  - tqdm
  - numpy<2.0             # diff_gaussian_rasterization not yet ABI-compatible with numpy 2.x
  - matplotlib
  - pillow
  - scikit-image
  - scipy
  - pyyaml
  - pip:
      - imageio
      - opencv-python
      - joblib
      - submodules/diff-gaussian-rasterization
      - submodules/simple-knn
      - submodules/fused-ssim
