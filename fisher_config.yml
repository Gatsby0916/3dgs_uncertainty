# —— 数据与输出路径 ——  
# dataset: 场景根目录（包含 images/）  
# output_dir: train.py 和 render.py 的输出目录
dataset: "data/kitchen"
output_dir: "data/kitchen/output"

# —— 掩码目录 ——  
# SAM 生成的 *_prob.npy 全概率掩码所在目录  
mask_dir: "C:/Users/李海毅/Desktop/CVlearning/sam2/dataset/kitchen/kitchen_mask"

# —— 初始随机划分 ——  
# 仅从排序后的前 max_pool 张图中随机选 init_pick 张作为训练起始集  
max_pool:    100   # 候选视角数上限  
init_pick:    4   # 初始训练视角数  

# —— NBV 循环参数 ——  
# 20 张总训练视角 ⇒ 新增视角 20−init_pick = 16 轮  
max_rounds:        16  
# 每轮训练迭代步数 Δ = 30000 ÷ (20−init_pick) = 1875  
train_iter_init:  1875  # 初始迭代步数  
train_iter_delta: 1875  

# —— Uncertainty 渲染 & 打分 ——  
uncert_mode:  
  patch_size: 2    # 每个 patch 的边长  
  thr:        0.3  # 掩码阈值：>=thr 的 patch 才计算  
  mode:       mean # 打分模式（mean 或 sum）

# —— 渲染视角限制 ——  
# 每次只渲染前 max_views 张来加速  
max_views: 100
